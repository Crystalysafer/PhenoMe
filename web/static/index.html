<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>PhenoMe Web</title>
    <link rel="stylesheet" href="/static/styles.css?v=20261106a">
    <script src="/static/app.js?v=20261106a" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand-block">
        <span class="brand-logo-wrap"><img class="brand-logo" src="/assets/icon.png" alt="PhenoMe"></span>
        <div class="brand-text">
          <h1>PhenoMe Web</h1>
          <span class="status-line"><i id="status-dot"></i><span id="service-status" data-i18n="status.connecting">连接中</span></span>
        </div>
      </div>
      <button id="help-open" class="language-toggle help-button" type="button" data-i18n-title="help.open" title="使用说明">?</button>
      <button id="language-toggle" class="language-toggle" type="button" data-i18n-title="language.switch" title="切换语言">EN</button>
    </header>

    <!-- Opens by itself the first time this browser visits, then only on demand.
         Content comes from /api/help, which the desktop dialog renders too. -->
    <div id="help-overlay" class="help-overlay" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
      <div class="help-panel">
        <div class="help-head">
          <h2 id="help-title">PhenoMe</h2>
          <button id="help-close" class="command command-primary" type="button" data-i18n="help.close">知道了</button>
        </div>
        <div id="help-body" class="help-body"></div>
      </div>
    </div>

    <main class="unified-app">
      <!-- Three tiers on purpose: opening an image, analysing it, and calibrating
           it are different kinds of action and used at different moments. -->
      <div class="toolbar" aria-label="工具栏">
        <div class="tool-group tool-group-primary">
          <label class="command command-primary command-lead" for="workspace-file">
            <span class="command-icon" aria-hidden="true">+</span>
            <span data-i18n="toolbar.open">打开图片</span>
          </label>
          <!-- One input, no `capture`: the phone's own sheet then offers camera,
               photo library and files, which is exactly the choice we want. -->
          <input id="workspace-file" class="visually-hidden" type="file" accept="image/*">
          <button id="clear-image" class="command command-quiet" type="button" disabled data-i18n="toolbar.clear">清除</button>
        </div>

        <div class="tool-group">
          <span class="tool-group-label" data-i18n="group.sample">示例图片</span>
          <div class="tool-row">
            <button id="sample-pods" class="sample-button" type="button" data-sample="pods">
              <img src="/static/samples/pods_thumb.jpg?v=20261106a" alt="" aria-hidden="true">
              <span data-i18n="sample.pods">豆荚</span>
            </button>
            <button id="sample-seeds" class="sample-button" type="button" data-sample="seeds">
              <img src="/static/samples/seeds_thumb.jpg?v=20261106a" alt="" aria-hidden="true">
              <span data-i18n="sample.seeds">种子</span>
            </button>
            <button id="sample-leaves" class="sample-button" type="button" data-sample="leaves">
              <img src="/static/samples/leaves_thumb.jpg?v=20261106a" alt="" aria-hidden="true">
              <span data-i18n="sample.leaves">叶片</span>
            </button>
            <button id="sample-flowers" class="sample-button" type="button" data-sample="flowers">
              <img src="/static/samples/flowers_thumb.jpg?v=20261106a" alt="" aria-hidden="true">
              <span data-i18n="sample.flowers">花</span>
            </button>
          </div>
        </div>

        <div class="tool-group">
          <span class="tool-group-label" data-i18n="group.analyze">分析</span>
          <div class="tool-row">
            <button id="semantic-detect" class="command command-action" type="button" disabled data-i18n="toolbar.semantic">语义检测</button>
            <!-- One button for the whole click flow: enter picking, then the same
                 button saves the object it is previewing. Two separate buttons
                 named "点击分割" and "确认目标" read like two ways to start. -->
            <button id="pick-object" class="command command-action" type="button" disabled aria-pressed="false" data-i18n="pick.start">点选目标</button>
            <button id="reset-points" class="command command-quiet" type="button" disabled data-i18n="toolbar.resetPoints">清除提示点</button>
          </div>
        </div>

        <details id="calibrate-group" class="tool-group tool-group-collapsible">
          <summary class="tool-group-label" data-i18n="group.calibrate">标定与比例</summary>
          <div class="tool-row">
            <button id="color-checker" class="command command-quiet" type="button" disabled data-i18n="toolbar.color">色卡矫正</button>
            <button id="ruler-detection" class="command command-quiet" type="button" disabled data-i18n="toolbar.ruler">尺度检测</button>
            <button id="set-scale" class="command command-quiet" type="button" disabled data-i18n="toolbar.scale">设置比例</button>
          </div>
        </details>

        <div class="tool-group tool-group-end">
          <button id="load-model" class="command command-quiet" type="button" data-i18n="model.load">加载模型</button>
        </div>
      </div>

      <!-- One progress strip for every long operation: upload has real byte
           progress, the GPU/CPU steps are time-estimated. Without it the phone
           just looks frozen for 3-17 seconds. -->
      <div id="progress" class="progress" hidden>
        <div class="progress-track"><i id="progress-fill"></i></div>
        <span id="progress-label"></span>
        <span id="progress-percent"></span>
      </div>

      <div class="workspace-grid">
        <aside class="files-panel panel-band">
          <div class="panel-heading"><h2 data-i18n="panel.image">图像</h2><span id="file-count">0</span></div>
          <div id="workspace-file-list" class="file-list"><p class="empty-copy" data-i18n="panel.emptyImage">尚未打开图片</p></div>
          <div class="panel-note" id="model-note" data-i18n="model.notLoaded">模型未加载</div>
        </aside>

        <section class="canvas-panel" aria-label="图像画布">
          <div id="workspace-stage" class="image-stage">
            <!-- A label, not a div: tapping the empty canvas is the most obvious
                 way to open an image, so it drives the same file input. -->
            <label class="stage-empty" for="workspace-file">
              <span class="stage-symbol" aria-hidden="true">+</span>
              <strong data-i18n="canvas.empty">点这里打开图片</strong>
              <span class="stage-hint" data-i18n="canvas.emptyHint">也可以选择上方的示例图片</span>
            </label>
            <div id="canvas-frame" class="canvas-frame">
              <img id="workspace-preview" alt="当前图像">
              <canvas id="canvas-overlay" class="canvas-overlay" aria-hidden="true"></canvas>
            </div>
          </div>
          <div class="canvas-footer">
            <span id="workspace-dimensions">0 x 0</span>
            <span id="canvas-hint" data-i18n="canvas.hint.noImage">打开图片后自动准备分割</span>
            <span id="scale-readout">1 pixel = 1 pixel</span>
          </div>
        </section>

        <aside class="details-panel panel-band">
          <div class="panel-heading detail-tabs">
            <button class="detail-tab is-active" type="button" data-detail-target="objects" data-i18n="panel.objects">目标</button>
            <button class="detail-tab" type="button" data-detail-target="traits" data-i18n="panel.traits">表型</button>
          </div>
          <div class="detail-body">
            <div class="detail-pane is-active" data-detail="objects"><div id="object-list" class="object-list"><div class="object-empty" data-i18n="panel.noObjects">暂无目标</div></div></div>
            <div class="detail-pane" data-detail="traits"><div id="trait-wrap" class="trait-wrap"><div class="object-empty" data-i18n="panel.noTraits">暂无表型结果</div></div></div>
          </div>
          <div class="details-actions">
            <button id="calc-traits" class="command command-action" type="button" disabled data-i18n="actions.calc">计算</button>
            <button id="export-results" class="command command-primary" type="button" disabled data-i18n="actions.download">下载形状表</button>
            <button id="export-annotation" class="command command-quiet" type="button" disabled data-i18n="actions.annotation">导出标注</button>
            <button id="clear-objects" class="command command-quiet" type="button" disabled data-i18n="actions.clearAll">删除全部</button>
          </div>
        </aside>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
